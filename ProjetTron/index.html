<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projet Tron</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Projet Tron</h1>

    <canvas id="canvas_dessin" width="800" height="590"></canvas>
    <button id="touche" onclick="ouvrirPlus('modal')">Changer les touches</button>

    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="fermerPlus('modal')">&times;</span>
            <h2>Touches</h2>
            <div class="joueurs">

                <div class="joueur">
                    <h3>Joueur 1</h3>
                    <p>Monter : <span id="j1_haut">Z</span></p> <button onclick="changerTouche('p1','up')">Changer</button>
                    <p>Tourner à gauche : <span id="j1_gauche">Q</span></p> <button onclick="changerTouche('p1','left')">Changer</button>
                    <p>Tourner à droite : <span id="j1_droite">D</span></p> <button onclick="changerTouche('p1','right')">Changer</button>
                    <p>Descendre : <span id="j1_bas">W</span></p> <button onclick="changerTouche('p1','down')">Changer</button>
                    <p>Sauter : <span id="j1_sauter">A</span></p> <button onclick="changerTouche('p1','jump')">Changer</button>
                </div>

                <div class="joueur">
                    <h3>Joueur 2</h3>
                    <p>Monter : <span id="j2_haut">O</span></p> <button onclick="changerTouche('p2','up')">Changer</button>
                    <p>Tourner à gauche : <span id="j2_gauche">K</span></p> <button onclick="changerTouche('p2','left')">Changer</button>
                    <p>Tourner à droite : <span id="j2_droite">M</span></p> <button onclick="changerTouche('p2','right')">Changer</button>
                    <p>Descendre : <span id="j2_bas">;</span></p> <button onclick="changerTouche('p2','down')">Changer</button>
                    <p>Sauter : <span id="j_sauter">I</span></p> <button onclick="changerTouche('p2','jump')">Changer</button>
                </div>

            </div>
        </div>
    </div>

<script src="script.js"></script>
</body>
</html>
